name: Android CI

on:
  pull_request:
  push:
    branches: [ main, master ]
    paths-ignore: [ 'docs/**', '**/*.md' ]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint, debug APK
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate Gradle wrapper
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') != '' }}
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9   # used only when ./gradlew is not committed

      - name: Provide Firebase config
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON secret: using the PLACEHOLDER example (APK builds, but sign-in will not work)."
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Choose Gradle command
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; echo "GRADLE=./gradlew" >> $GITHUB_ENV; else echo "GRADLE=gradle" >> $GITHUB_ENV; fi

      - name: Unit tests
        run: $GRADLE --no-daemon testDebugUnitTest

      - name: Android lint
        run: $GRADLE --no-daemon lintDebug

      - name: Build debug APK
        run: $GRADLE --no-daemon assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*
          retention-days: 14

  instrumentation:
    name: Instrumentation tests (emulator)
    runs-on: ubuntu-latest
    needs: build
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Provide Firebase config
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; else cp app/google-services.json.example app/google-services.json; fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run connected tests (Room/repository + Compose; no production credentials)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: if [ -f ./gradlew ]; then chmod +x ./gradlew && ./gradlew connectedDebugAndroidTest; else gradle connectedDebugAndroidTest; fi
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: app/build/reports/androidTests/
          retention-days: 14
